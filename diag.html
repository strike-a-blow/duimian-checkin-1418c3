<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>Npoint 写入诊断</title></head>
<body style="font:16px/1.6 -apple-system,sans-serif;padding:24px;">
<h1>Npoint 写入诊断</h1><pre id="out" style="white-space:pre-wrap;background:#f5f5f5;padding:16px;border-radius:8px;">检测中…</pre>
<script>
(async function () {
  var out = document.getElementById('out');
  var base = 'https://api.npoint.io/7f22a9c6c5cc21a8a321';
  var log = [];
  try {
    var r = await fetch(base + '?t=' + Date.now(), {cache: 'no-store'});
    log.push('GET1 HTTP ' + r.status + ' ' + (await r.text()).slice(0,120));
    var payload = {probe: Date.now(), from: 'safari'};
    var p = await fetch(base + '?t=' + Date.now(), {
      method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload)
    });
    log.push('POST HTTP ' + p.status + ' ' + (await p.text()).slice(0,120));
    var r2 = await fetch(base + '?t=' + Date.now(), {cache: 'no-store'});
    log.push('GET2 HTTP ' + r2.status + ' ' + (await r2.text()).slice(0,200));
  } catch (e) {
    log.push('ERROR ' + String(e));
  }
  out.textContent = log.join('\n') + '\nDONE';
})();
</script>
</body></html>
